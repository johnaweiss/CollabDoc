<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CollabDoc</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html,body{margin:0;width:100%;height:100%;font:14px sans-serif}
    iframe{width:100%;height:100%;border:0}
    #tools{position:fixed;top:8px;right:8px;z-index:1;display:flex;gap:6px}
    #setup{position:fixed;bottom:8px;left:8px;max-width:80%;background:white;padding:5px}
  </style>
</head>
<body>
  <div id="tools"><button id="save">Save</button><button id="log">Test log</button></div>
  <iframe id="doc" title="HTML document" sandbox="allow-same-origin" srcdoc="<body>Install CollabDoc, then select Open with → CollabDoc for a local HTML file.</body>"></iframe>
  <div id="setup"><a href="./sample-doc.html" download>Sample HTML</a> · <a id="cli" href="./downloads/CollabDoc-CLI-Setup.exe" download>QuickJS agent installer</a></div>
  <script src="./app.js" defer></script>
</body>
</html>
